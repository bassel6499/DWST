name: Audit Type Check

on:
  push:
    branches: [audit/canonical-state-refactor]
  pull_request:
    branches: [audit/canonical-state-refactor]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test:unit --run
      - run: pnpm test:bench --run
