name: WW2 Combat Overhaul Validation

on:
  push:
    branches:
      - work/ww2-combat-overhaul
  pull_request:
    branches:
      - main
    paths:
      - 'src/dwst/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ww2-overhaul-validation.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test:unit --run
      - run: pnpm test:bench --run
